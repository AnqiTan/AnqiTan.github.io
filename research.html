<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research | {name}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="research" data-root="">
  <main>
    <section class="page-banner">
      <div class="wrap"><p class="eyebrow">Research</p><h1>Research Overview</h1></div>
    </section>
    <section class="section">
      <div class="wrap">
        <div class="block"><h2>Research Statement</h2><div data-render="research-statement"></div></div>
        <div class="block"><h2>Research Interests</h2><ul class="interest-list" data-render="research-interests"></ul></div>
        <div class="block" id="publications" data-hide-if-empty="publications"><h2>Publications</h2><div class="pub-list" data-render="publications"></div></div>
        <div class="hero-actions">
          <a class="btn" href="projects.html#current">Current Projects</a>
          <a class="btn ghost" href="projects.html#past">Past Projects</a>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
