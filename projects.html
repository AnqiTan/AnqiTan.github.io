<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | {name}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="projects" data-root="">
  <main>
    <section class="page-banner">
      <div class="wrap"><p class="eyebrow">Research</p><h1>Projects</h1><p>Research and engineering projects I have led or contributed to.</p></div>
    </section>
    <section class="section" id="current">
      <div class="wrap">
        <div class="section-head"><h2>Current Projects</h2></div>
        <div class="project-list" data-render="projects-current"></div>
      </div>
    </section>
    <section class="section" id="past">
      <div class="wrap">
        <div class="section-head"><h2>Past Projects</h2></div>
        <div class="project-list" data-render="projects-past"></div>
      </div>
    </section>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
