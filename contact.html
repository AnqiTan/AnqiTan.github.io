<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Anqi Tan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact" data-root="">
  <main>
    <section class="page-banner">
      <div class="wrap"><p class="eyebrow" data-i18n="contact_eyebrow">Get in touch</p><h1 data-i18n="contact">Contact</h1><p data-i18n="contact_desc">I'm always happy to talk about research, collaborations, and opportunities.</p></div>
    </section>
    <section class="section">
      <div class="wrap">
        <div class="contact-card">
          <h2 data-i18n="say_hello">Say hello</h2>
          <p data-i18n="contact_text">The best way to reach me is by email: <a data-href="email">send me an email</a>.</p>
          <p data-render="contact-emails"></p>
          <div class="social" data-render="contact-links"></div>
          <!-- 想要在线留言表单：去 https://formspree.io 免费注册，把 action 换成你的地址，再删除 hidden 属性 -->
          <form class="form" action="https://formspree.io/f/your-form-id" method="POST" hidden>
            <input name="name" placeholder="Your name" required>
            <input name="email" type="email" placeholder="Your email" required>
            <textarea name="message" placeholder="Message" required></textarea>
            <button class="btn" type="submit">Send</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
